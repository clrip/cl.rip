<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cylian</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="m/icon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="m/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="m/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0970E6">
    <style>
        :root {
            color-scheme: dark;
            --accent: #0970E6;
            --bg: #000;
            --fg: #FFF;
            --dim: #8F8F8F;
            --surface: #0E0E0E;
            --surface-hi: #161616;
            --on-accent: #04121F;
        }

        * { box-sizing: border-box; }
        ::selection { background: var(--accent); color: var(--bg); }

        /* Card plus tools is the whole page, so centre the stack in the viewport. */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 24px;
            background: var(--bg);
            color: var(--fg);
            font: 400 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { width: 100%; max-width: 520px; }

        a { text-decoration: none; color: inherit; }

        /* Real card proportions. Mark at the top, identity along the bottom edge,
           the middle deliberately left empty the way a printed card is. */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            aspect-ratio: 1.75 / 1;
            padding: 26px 28px;
            border-radius: 24px;
            background: linear-gradient(150deg, #1183FF, #0A5FC4 55%, #084E9E);
            box-shadow: 0 24px 70px rgba(9, 112, 230, .30),
                        inset 0 1px 0 rgba(255, 255, 255, .22);
            color: var(--on-accent);
        }

        /* Logo sits straight on the blue, no plate behind it. */
        .logo { display: block; width: 38px; height: 38px; }
        .cardfoot {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }
        .cardfoot h1 {
            margin: 0 0 1px;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -.025em;
        }

        .reach { font-size: 13.5px; font-weight: 600; }
        .reach:hover { text-decoration: underline; }

        h2 {
            margin: 30px 0 10px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        ul { margin: 0; padding: 0; list-style: none; }
        .tools { display: grid; gap: 8px; }
        .tools a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 14px;
            border-radius: 18px;
            background: var(--surface);
        }
        .tools a:hover { background: var(--surface-hi); }

        /* Launcher tile, so each entry reads as an app rather than a link. */
        .tile { flex: none; width: 42px; height: 42px; border-radius: 13px; }
        .meta { display: flex; min-width: 0; flex-direction: column; }
        .meta b { font-size: 14.5px; font-weight: 600; }
        .meta span { color: var(--dim); font-size: 13px; line-height: 1.4; }

        .chev {
            flex: none;
            width: 8px;
            height: 8px;
            margin: 0 6px 0 auto;
            border-right: 2px solid #4A4A4A;
            border-bottom: 2px solid #4A4A4A;
            transform: rotate(-45deg);
        }
        .tools a:hover .chev { border-color: var(--accent); }

        @media (max-width: 430px) {
            .cardfoot { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="wrap">

    <main class="card">
        <img class="logo" src="m/icon-inverted.png" alt="" />
        <div class="cardfoot">
            <h1>Cylian</h1>
            <a class="reach" href="mailto:i@cl.rip">i@cl.rip</a>
        </div>
    </main>

    <h2>Tools</h2>
    <ul class="tools">
        <li>
            <a href="t/r/c.html">
                <img class="tile" src="m/icon.png" alt="" />
                <span class="meta">
                    <b>Clothing Template Downloader</b>
                    <span>Roblox classic shirt, pants and T-shirt templates</span>
                </span>
                <span class="chev"></span>
            </a>
        </li>
        <!-- EDIT ME: copy this block for each additional tool. -->
    </ul>

</div>

</body>
</html>
