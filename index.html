<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cylian</title>
<meta name="description" content="Cylian — independent developer. Site under construction.">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0C;
    --text:#F5F5F7;
    --muted:#7E7E88;
    --line:rgba(255,255,255,.08);
    --accent:#3B8CFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:32px}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:#fff}

  main{position:relative;text-align:center;max-width:340px;
    animation:up .6s cubic-bezier(.16,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){main{animation:none}}

  main::before{content:"";position:absolute;pointer-events:none;
    width:460px;height:460px;left:50%;top:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(59,140,255,.14),transparent 62%)}
  main>*{position:relative}

  img{width:52px;height:52px;border-radius:12px;display:block;margin:0 auto;
    box-shadow:0 8px 30px rgba(59,140,255,.36)}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:2.6rem;
    letter-spacing:-.02em;line-height:1.1;margin-top:22px;color:#fff}
  p{color:var(--muted);font-size:.95rem;margin-top:10px}
  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    font-size:.85rem;color:var(--muted)}
  .foot a{color:var(--accent);transition:opacity .15s}
  .foot a:hover{opacity:.75}
</style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" width="52" height="52">
    <h1>Cylian</h1>
    <p>Website under construction.</p>
    <div class="foot"><a href="mailto:hello@cylian.dev">hello@cylian.dev</a></div>
  </main>
</body>
</html>
